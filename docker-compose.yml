services:
  feed-watcher:
    build: .
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8000}
    volumes:
      - ./media:/media:ro
      - ./rss:/app/rss
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./media:/media:ro
      - ./rss:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped